<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InmoDash | Gestión Inmobiliaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="flex items-center justify-between mb-12">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">InmoDash <span class="text-indigo-600">Pro</span></h1>
            </div>
            <div class="hidden sm:block text-sm text-slate-500 font-medium">Panel de Gestión de Activos</div>
        </header>

        <!-- Main Search Section -->
        <main class="space-y-8">
            <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-6 sm:p-8 border border-slate-100">
                <label for="rc-input" class="block text-sm font-semibold text-slate-700 mb-3">Referencia Catastral</label>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="relative flex-grow">
                        <input 
                            type="text" 
                            id="rc-input" 
                            maxlength="20"
                            placeholder="Ej: 1234567AB1234S0001XX" 
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all uppercase font-mono text-lg tracking-wider"
                        >
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                    </div>
                    <button 
                        onclick="fetchInmueble()"
                        id="search-btn"
                        class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center space-x-2"
                    >
                        <span>Consultar Inmueble</span>
                    </button>
                </div>
                <p class="mt-4 text-xs text-slate-400">Introduce los 20 caracteres de la referencia para obtener los detalles técnicos.</p>
            </div>

            <!-- Skeleton Loader (Hidden by default) -->
            <div id="skeleton-loader" class="hidden fade-in">
                <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-50 flex justify-between items-center">
                        <div class="h-6 w-48 skeleton rounded"></div>
                        <div class="h-6 w-20 skeleton rounded-full"></div>
                    </div>
                    <div class="aspect-video skeleton w-full"></div>
                    <div class="p-6">
                        <div class="h-4 w-3/4 skeleton rounded mb-3"></div>
                        <div class="h-4 w-1/2 skeleton rounded"></div>
                    </div>
                </div>
            </div>

            <!-- Result Card (Hidden by default) -->
            <div id="result-card" class="hidden fade-in">
                <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden transition-all hover:shadow-2xl hover:shadow-slate-200/60">
                    <div class="p-6 border-b border-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <span class="text-xs font-bold text-indigo-500 uppercase tracking-widest block mb-1">Referencia Localizada</span>
                            <h2 id="res-referencia" class="text-xl font-bold text-slate-900 font-mono"></h2>
                        </div>
                        <div id="res-badge-container">
                            <!-- Badge will be injected here -->
                        </div>
                    </div>
                    
                    <div class="relative group">
                        <img id="res-image" src="" alt="Vista del inmueble" class="w-full aspect-video object-cover">
                        <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-colors"></div>
                    </div>

                    <div class="p-6 bg-slate-50/50">
                        <div class="grid grid-cols-2 gap-8">
                            <div>
                                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Latitud</h4>
                                <p id="res-lat" class="text-slate-700 font-medium"></p>
                            </div>
                            <div>
                                <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Longitud</h4>
                                <p id="res-lon" class="text-slate-700 font-medium"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Error Message (Hidden by default) -->
            <div id="error-alert" class="hidden fade-in">
                <div class="bg-rose-50 border border-rose-100 rounded-2xl p-6 flex items-start space-x-4">
                    <div class="w-12 h-12 bg-rose-100 rounded-full flex-shrink-0 flex items-center justify-center text-rose-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-rose-900 font-bold mb-1">Error de consulta</h3>
                        <p id="error-text" class="text-rose-700 text-sm"></p>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="mt-16 text-center text-slate-400 text-xs">
            &copy; 2024 InmoDash Pro - Herramienta Avanzada de Gestión de Activos.
        </footer>
    </div>

    <script>
        const input = document.getElementById('rc-input');
        const searchBtn = document.getElementById('search-btn');
        const skeleton = document.getElementById('skeleton-loader');
        const resultCard = document.getElementById('result-card');
        const errorAlert = document.getElementById('error-alert');

        // Auto uppercase and Enter key
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchInmueble();
        });

        async function fetchInmueble() {
            const rc = input.value.trim();
            if (!rc) return;

            // Reset UI
            hideAll();
            skeleton.classList.remove('hidden');
            searchBtn.disabled = true;
            searchBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const response = await fetch(`http://localhost:5000/api/inmueble/${rc}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('La referencia catastral no existe en nuestra base de datos.');
                    }
                    throw new Error('Ha ocurrido un error inesperado. Inténtelo más tarde.');
                }

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                showError(error.message);
            } finally {
                skeleton.classList.add('hidden');
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        function displayResult(data) {
            document.getElementById('res-referencia').textContent = data.referencia;
            document.getElementById('res-lat').textContent = data.coordenadas.lat;
            document.getElementById('res-lon').textContent = data.coordenadas.lon;
            
            const img = document.getElementById('res-image');
            img.src = data.url_imagen;

            // Badge logic
            const badgeContainer = document.getElementById('res-badge-container');
            const isUrbana = data.tipo === 'URBANA';
            const badgeColor = isUrbana ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700';
            
            badgeContainer.innerHTML = `
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${badgeColor}">
                    ${data.tipo}
                </span>
            `;

            resultCard.classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            errorAlert.classList.remove('hidden');
        }

        function hideAll() {
            skeleton.classList.add('hidden');
            resultCard.classList.add('hidden');
            errorAlert.classList.add('hidden');
        }
    </script>
</body>
</html>
